name: App and freelance research

on:
  schedule:
    # 07:17 Pakistan time. Daily always; Monday adds weekly; 1st adds monthly.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      period:
        description: Report periods (auto follows the daily/weekly/monthly calendar)
        type: choice
        options: [auto, all, daily, weekly, monthly]
        default: auto
      dry_run:
        description: Collect and generate artifacts without committing or emailing
        type: boolean
        default: true
      quick:
        description: Smaller integration scan (requires dry_run)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: opportunity-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      PYTHONUNBUFFERED: "1"
      PERIOD: ${{ inputs.period || 'auto' }}
      QUICK: ${{ inputs.quick || false }}
      DATA_DIR: ${{ inputs.quick && '.local-data' || 'data' }}
    steps:
      - name: Check run mode
        if: ${{ inputs.quick && !inputs.dry_run }}
        run: |
          echo "::error::Quick scans require dry_run to keep production history clean."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install browser for Scrapling fallback
        continue-on-error: true
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: python -m playwright install --with-deps chromium
      - name: Regression checks
        run: python -m unittest discover -s tests -v
      - name: Collect evidence
        id: scan
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          FREELANCER_TOKEN: ${{ secrets.FREELANCER_TOKEN }}
          APP_INTELLIGENCE_URL: ${{ secrets.APP_INTELLIGENCE_URL }}
        run: |
          args=()
          if [ "$QUICK" = "true" ]; then args+=(--quick); fi
          python -m research scan --data-dir "$DATA_DIR" "${args[@]}"
      - name: Generate two PDFs per due period
        if: ${{ !cancelled() && steps.scan.outcome != 'skipped' }}
        run: python -m research report --period "$PERIOD" --data-dir "$DATA_DIR"
      - name: Archive reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-reports-${{ github.run_number }}
          path: |
            reports/
            data/snapshots/
            .local-data/snapshots/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
      - name: Persist research history
        if: ${{ !cancelled() && !inputs.dry_run && steps.scan.outcome != 'skipped' }}
        run: |
          git config user.name "trend-scan"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/
          if ! git diff --staged --quiet; then
            git commit -m "research snapshot $(date -u +%Y-%m-%d)"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Email reports
        if: ${{ success() && !inputs.dry_run }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python -m research email --period "$PERIOD"
      - name: Persist delivery receipts
        if: ${{ !cancelled() && !inputs.dry_run }}
        run: |
          if [ -f data/delivery.json ]; then
            git add data/delivery.json
            if ! git diff --staged --quiet; then
              git commit -m "record report delivery $(date -u +%Y-%m-%d)"
              git pull --rebase origin "$GITHUB_REF_NAME"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi
      - name: Write run summary
        if: always()
        run: |
          echo "## TrendScan research" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the opportunity-reports artifact for two PDFs per requested period, JSON summaries and source health." >> "$GITHUB_STEP_SUMMARY"
          echo "Scheduled delivery requires SMTP_PASSWORD. Gmail sender/host defaults are in config.json; SMTP_HOST and SMTP_USERNAME secrets can override them. No reports are emailed in dry-run mode." >> "$GITHUB_STEP_SUMMARY"
